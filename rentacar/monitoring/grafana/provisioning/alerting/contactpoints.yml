apiVersion: 1

contactPoints:
  - orgId: 1
    name: Discord RentaCar
    receivers:
      - uid: discord-rentacar-receiver
        type: discord
        settings:
          url: "${DISCORD_WEBHOOK_URL}"
          message: |
            {{ range .Alerts }}
            **[{{ .Status | toUpper }}] {{ .Labels.severity | toUpper }} — {{ .Annotations.summary }}**
            {{ .Annotations.description }}
            {{ if .GeneratorURL }}[Ver en Grafana]({{ .GeneratorURL }}){{ end }}
            {{ end }}
        disableResolveMessage: false
