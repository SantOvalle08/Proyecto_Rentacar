name: CI — Validate PR

on:
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: Jest + BDD ────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rentacar/back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rentacar/back/package-lock.json

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-bin-${{ runner.os }}-v20

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        id: jest
        run: npm test -- --json --outputFile=jest-results.json
        continue-on-error: true
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-ci-only

      - name: Run BDD tests
        id: bdd
        run: |
          npx cucumber-js 'features/**/*.feature' \
            --require features/support/hooks.js \
            --require features/support/world.js \
            --require 'features/step_definitions/**/*.steps.js' \
            --parallel 1 \
            --format progress \
            --format 'json:cucumber-results.json'
        continue-on-error: true
        env:
          NODE_ENV: test
          JWT_SECRET: test-jwt-secret-ci-only

      - name: Report to TestRail
        if: always()
        run: node ../../.github/scripts/testrail-report.js
        env:
          TESTRAIL_URL: ${{ secrets.TESTRAIL_URL }}
          TESTRAIL_USER: ${{ secrets.TESTRAIL_USER }}
          TESTRAIL_PASSWORD: ${{ secrets.TESTRAIL_APIKEY }}
          JEST_RESULTS_PATH: jest-results.json
          BDD_RESULTS_PATH: cucumber-results.json
          CI_SHA: ${{ github.sha }}
          CI_REF: ${{ github.head_ref || github.ref_name }}
          CI_RUN_ID: ${{ github.run_id }}

      - name: Fail if tests failed
        if: steps.jest.outcome == 'failure' || steps.bdd.outcome == 'failure'
        run: exit 1

  # ─── Frontend: lint + build verification ───────────────────────────────────
  lint-frontend:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rentacar/front/files

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: rentacar/front/files/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        env:
          NEXT_PUBLIC_API_URL: https://pappspypbd.us-east-2.awsapprunner.com
